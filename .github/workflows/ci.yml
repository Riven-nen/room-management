name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check backend syntax
        run: find backend -name '*.js' -not -path 'backend/node_modules/*' -exec node --check {} \;
